name: Live accessibility and performance audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de producción o preview de Cloudflare Pages"
        required: false
        default: "https://candidatura-cee2027.pages.dev/"

permissions:
  contents: read

concurrency:
  group: live-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Allow Cloudflare Pages deployment to finish
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: sleep 75
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve and validate audit target URL
        id: preview
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Cloudflare Pages branch-preview hostnames truncate branch slugs to 28 characters.
            BRANCH_SLUG="$(printf \"%s\" \"${BRANCH_NAME}\" | tr \"[:upper:] /_\" \"[:lower:]---\" | tr -cd \"[:lower:]0-9-\" | sed \"s/--*/-/g; s/^-//; s/-$//\" | cut -c1-28)"
            CANDIDATE_URL="https://${BRANCH_SLUG}.candidatura-cee2027.pages.dev/"
          else
            CANDIDATE_URL="${INPUT_BASE_URL:-https://candidatura-cee2027.pages.dev/}"
          fi

          # Validate in Node without interpolating user input into shell commands.
          VALIDATED_URL="$(CANDIDATE_URL="${CANDIDATE_URL}" node --input-type=module <<'NODE'
          const raw = process.env.CANDIDATE_URL;
          let url;
          try { url = new URL(raw); } catch { console.error('Invalid audit URL.'); process.exit(1); }
          const allowedHost = url.hostname === 'candidatura-cee2027.pages.dev'
            || (url.hostname.endsWith('.candidatura-cee2027.pages.dev')
                && url.hostname.length > '.candidatura-cee2027.pages.dev'.length);
          if (url.protocol !== 'https:' || !allowedHost || url.username || url.password
              || url.port || url.pathname !== '/' || url.search || url.hash) {
            console.error('Audit URL must be HTTPS on the official Pages domain, without credentials, port, path, query or fragment.');
            process.exit(1);
          }
          process.stdout.write(url.origin + '/');
          NODE
          )"
          echo "base_url=${VALIDATED_URL}" >> "$GITHUB_OUTPUT"
      - name: Detect maintenance mode before live audit
        id: preflight
        env:
          CEE_AUDIT_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          BASE_URL="${CEE_AUDIT_BASE_URL%/}"
          STATUS="$(curl -sS -o /tmp/cee-audit-home.html -w '%{http_code}' "$BASE_URL/")"
          if [ "$STATUS" = "503" ] && grep -Eiq 'Estamos en mantenimiento|maintenance' /tmp/cee-audit-home.html; then
            echo "audit_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live audit skipped: the target is explicitly in maintenance mode (HTTP 503)."
          elif [ "$STATUS" = "200" ]; then
            echo "audit_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Preflight failed: target returned HTTP $STATUS (not an explicit maintenance page or healthy 200)."
            exit 1
          fi
      - name: Install browser audit tools
        if: steps.preflight.outputs.audit_ready == 'true'
        run: |
          npm install --no-save playwright @axe-core/playwright lighthouse
          npx playwright install --with-deps chromium
      - name: Test every page on mobile, tablet and desktop
        if: steps.preflight.outputs.audit_ready == 'true'
        env:
          CEE_AUDIT_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: node scripts/audit-live-site.mjs
      - name: Run Lighthouse on key pages for mobile and desktop
        if: steps.preflight.outputs.audit_ready == 'true'
        env:
          CEE_AUDIT_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          mkdir -p audit-results/lighthouse
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          BASE_URL="${CEE_AUDIT_BASE_URL%/}"
          echo "Lighthouse Chrome: $CHROME_PATH"
          for device in mobile desktop; do
            if [ "$device" = "mobile" ]; then
              DEVICE_FLAGS=(
                --form-factor=mobile
                --screenEmulation.mobile=true
                --screenEmulation.width=390
                --screenEmulation.height=844
                --screenEmulation.deviceScaleFactor=2
              )
            else
              DEVICE_FLAGS=(--preset=desktop)
            fi

            for page in "" "pages/lista.html" "pages/proyecto.html" "pages/escucha.html"; do
              name=$(printf '%s-%s' "$device" "${page:-home}" | tr '/.' '--')
              npx lighthouse "${BASE_URL}/${page}" \
                "${DEVICE_FLAGS[@]}" \
                --chrome-flags="--headless --no-sandbox" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="audit-results/lighthouse/${name}.json" \
                --quiet
            done
          done
      - name: Print Lighthouse score summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'audit-results/lighthouse';
          if (!fs.existsSync(dir)) process.exit(0);
          for (const file of fs.readdirSync(dir).filter(name => name.endsWith('.json'))) {
            const report = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
            const scores = Object.entries(report.categories || {})
              .map(([key, value]) => `${key}=${Math.round((value.score ?? 0) * 100)}`)
              .join(' | ');
            console.log(`${file}: ${scores}`);
          }
          NODE
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cee-2027-site-audit
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
