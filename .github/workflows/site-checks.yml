name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate site structure and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/search.js
          node --check scripts/check-security.mjs
      - name: Validate HTML structure and local links
        run: node scripts/check-site.mjs
      - name: Check XSS, SSH and repository security hygiene
        run: node scripts/check-security.mjs
